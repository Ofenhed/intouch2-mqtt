[package]
name = "intouch2-mqtt"
version = "0.1.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["env_logger"]
log = ["tracing/log", "dep:log"]
env_logger = ["dep:env_logger", "log"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
env_logger = { workspace = true, optional = true, features = ["auto-color", "humantime"] }
intouch2.workspace = true
log = { workspace = true, optional = true, features = ["serde"] }
mqttrs = { workspace = true, features = ["derive"] }
rand.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "io-util"] }
tracing.workspace = true

[dev-dependencies]
serde_yaml = "0.9.34"
