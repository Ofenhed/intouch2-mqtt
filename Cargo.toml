[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace]
members = [
  "intouch2",
  "intouch2-mqtt",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
clap = "4.4"
disjoint_impls = "1.3.6"
env_logger = { version = "0.11", default-features = false }
intouch2 = { path = "./intouch2" }
log = "0.4"
mqttrs = "0.4.1"
nom = "7.1"
num-derive = "0.3"
num-traits = "0.2"
rand = "0.8"
serde = "1.0"
serde_json = "1.0"
strum = { version = "0.25", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.39" }
tracing = "0.1"
